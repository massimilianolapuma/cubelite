apiVersion: v1
kind: Config
clusters:
- name: prod-1
  cluster:
    server: https://prod-1-old.example.com:6443
- name: same
  cluster:
    server: https://same.example.com:6443
    certificate-authority: /etc/kube/ca.crt
    extensions:
    - name: example.com/meta
      extension:
        updated: "2026-01-01"
- name: rel-ca
  cluster:
    server: https://rel.example.com:6443
    certificate-authority: ca.crt
- name: proxied
  cluster:
    server: https://proxied.example.com:6443
    proxy-url: http://old-proxy.example.net:3128
users:
- name: team-a
  user:
    token: fake-token-old
- name: same-user
  user:
    client-certificate: /etc/kube/client.crt
    client-key: /etc/kube/client.key
- name: rel-user
  user:
    client-certificate: client.crt
- name: kubelogin
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: kubelogin
      args:
      - get-token
      - --server-id
      - old
