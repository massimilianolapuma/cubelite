apiVersion: v1
kind: Config
current-context: team-a
clusters:
- name: prod-1
  cluster:
    server: https://prod-1-new.example.com:6443
- name: shared
  cluster:
    server: https://shared.example.com:6443
    certificate-authority-data: ZmFrZS1jYS1kYXRh
    extensions:
    - name: example.com/meta
      extension:
        last-update: "2026-11-01"
contexts:
- name: team-a
  context:
    cluster: prod-1
    namespace: team-a
    user: team-a
- name: prod-1
  context:
    cluster: shared
    user: shared-user
- name: shared
  context:
    cluster: shared
    user: shared-user
users:
- name: shared-user
  user:
    token: fake-token-shared
- name: team-a
  user:
    token: fake-token-a2
