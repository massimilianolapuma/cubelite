[workspace]
resolver = "2"
members = ["crates/cubelite-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.2"
edition = "2021"
authors = ["Massimiliano La Puma"]
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
# kube and k8s-openapi are pinned to minor releases on purpose (see
# .github/dependabot.yml): each kube release supports one k8s-openapi line,
# so both are bumped together by hand.
kube = { version = "4.2", features = ["runtime", "derive", "client", "ws"] }
# Single Kubernetes API level for the whole workspace: the oldest one
# k8s-openapi 0.28 supports, for the widest cluster compatibility.
k8s-openapi = { version = "0.28", features = ["v1_32"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
