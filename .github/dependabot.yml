# Versioned Dependabot configuration (previously configured only in repo settings).
version: 2
updates:
  # pnpm workspace: root + apps/desktop share a single pnpm-lock.yaml at the root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Tauri must move in lockstep across Rust crates and npm packages (the CLI
    # refuses mismatched major.minor versions), which Dependabot can't do in
    # one PR. Tauri is updated manually instead.
    ignore:
      - dependency-name: "@tauri-apps/*"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # See the npm entry: Tauri crates are updated manually, together with @tauri-apps/*.
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
