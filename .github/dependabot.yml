# Versioned Dependabot configuration (previously configured only in repo settings).
version: 2
updates:
  # pnpm workspace: root + apps/desktop share a single pnpm-lock.yaml at the root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Tauri must move in lockstep across Rust crates and npm packages (the CLI
    # refuses mismatched major.minor versions), which Dependabot can't do in
    # one PR. Tauri is updated manually instead.
    ignore:
      - dependency-name: "@tauri-apps/*"
      # TypeScript 7 waits for typescript-eslint and svelte-check support
      # (typescript-eslint 8 peers on typescript <6.1); see #414.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # See the npm entry: Tauri crates are updated manually, together with @tauri-apps/*.
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
      # k8s-openapi is pinned by kube (one version per build); major bumps of
      # either must be done together by hand (#366).
      - dependency-name: "kube"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "k8s-openapi"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
