name: Install Tauri Linux dependencies
description: >-
  apt-get installs the GTK / WebKit packages the Tauri crates need, with a
  timeout per attempt, retries and a mirror fallback, so a slow Ubuntu mirror
  does not time the whole job out (#435).

inputs:
  install-recommends:
    description: >-
      Also install the packages' Recommends. Off for lint/test jobs (the -dev
      packages are enough to compile); on for release bundles, which keep the
      full runtime set the previous inline apt-get step installed.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The ~60 MB of .debs, kept between runs so a slow mirror only hurts when
    # the runner image or the package list changes (#569). Keyed on the image
    # (its package index moves with it); an older image's cache still seeds
    # every package whose version did not change.
    - name: Restore the .deb cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/tauri-linux-debs
        key: tauri-linux-debs-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-recommends-${{ inputs.install-recommends }}-${{ hashFiles('.github/actions/tauri-linux-deps/install.sh') }}
        restore-keys: |
          tauri-linux-debs-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-
    - name: apt-get install with retries
      shell: bash
      env:
        INSTALL_RECOMMENDS: ${{ inputs.install-recommends }}
      run: DEB_CACHE="$HOME/.cache/tauri-linux-debs" "${GITHUB_ACTION_PATH}/install.sh"
