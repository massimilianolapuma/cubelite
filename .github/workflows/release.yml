name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Detect releasable version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare workspace version against existing tags
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk -F '"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ -z "$VERSION" ]; then
            echo "Could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    name: Build desktop (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
          - platform: Linux
            os: ubuntu-22.04
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Signs the Tauri updater artifacts (.app.tar.gz / -setup.exe / msi /
      # AppImage) with the minisign private key so tauri-plugin-updater can
      # verify them client-side. See docs/RELEASING.md for backup/rotation.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Tauri / WebKit)
        if: matrix.platform == 'Linux'
        uses: ./.github/actions/tauri-linux-deps
        with:
          # Keep the Recommends: the AppImage bundle picks up runtime libraries
          # (GStreamer plug-ins etc.) that clippy and the tests do not need.
          install-recommends: "true"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No dependency cache in the release build: a cache written by a
        # PR/branch run must not feed into published artifacts (cache poisoning).
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm --filter desktop tauri:build

      - name: Collect artifacts with stable names
        shell: bash
        run: |
          mkdir -p out
          bundle_dir="target/release/bundle"
          # createUpdaterArtifacts: true (tauri.conf.json) makes the bundler
          # emit an extra signed artifact + .sig alongside the normal
          # installers: macOS `.app.tar.gz`, Windows nsis `-setup.exe`
          # (msi is also produced but nsis is what we standardize on for
          # the updater), Linux `.AppImage`. deb/rpm/dmg/msi stay
          # release-only assets — they don't go through the Tauri updater,
          # so no updater artifact/sig is collected for them. Stable names
          # here are what scripts/make-latest-json.mjs scans for later.
          case "${{ matrix.platform }}" in
            macOS)
              cp "$(find "$bundle_dir/dmg" -name '*.dmg' | head -1)" out/CubeLite-Desktop-macOS.dmg
              cp "$(find "$bundle_dir/macos" -name '*.app.tar.gz' | head -1)" out/CubeLite-Desktop-macOS.app.tar.gz
              cp "$(find "$bundle_dir/macos" -name '*.app.tar.gz.sig' | head -1)" out/CubeLite-Desktop-macOS.app.tar.gz.sig
              ;;
            Linux)
              cp "$(find "$bundle_dir/appimage" -name '*.AppImage' | head -1)" out/CubeLite-Desktop-Linux.AppImage
              cp "$(find "$bundle_dir/appimage" -name '*.AppImage.sig' | head -1)" out/CubeLite-Desktop-Linux.AppImage.sig
              cp "$(find "$bundle_dir/deb" -name '*.deb' | head -1)" out/CubeLite-Desktop-Linux.deb
              cp "$(find "$bundle_dir/rpm" -name '*.rpm' | head -1)" out/CubeLite-Desktop-Linux.rpm
              ;;
            Windows)
              cp "$(find "$bundle_dir/msi" -name '*.msi' | head -1)" out/CubeLite-Desktop-Windows.msi
              cp "$(find "$bundle_dir/nsis" -name '*.exe' | head -1)" out/CubeLite-Desktop-Windows-setup.exe
              cp "$(find "$bundle_dir/nsis" -name '*.exe.sig' | head -1)" out/CubeLite-Desktop-Windows-setup.exe.sig
              ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [version, build-desktop]
    # Publish even if one desktop platform failed (a broken Linux/Windows
    # bundle must not hold the whole release hostage); the macOS bundle is
    # required, checked after the download below.
    if: always() && needs.version.outputs.should_release == 'true' && (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Require the macOS bundle
        run: |
          test -f assets/CubeLite-Desktop-macOS.dmg || {
            echo "::error::The macOS desktop bundle is missing; not publishing."
            exit 1
          }

      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes from CHANGELOG
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # Pull the "## [X.Y.Z]" section out of CHANGELOG.md when present.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "_No CHANGELOG section for ${VERSION} — see the commit history below._" > notes.md
          fi
          {
            echo ""
            echo "---"
            echo "[Installation guide](https://massimilianolapuma.github.io/cubelite/docs/installation.html) · builds are not yet notarized/signed; see the guide for the one-time Gatekeeper/SmartScreen step."
          } >> notes.md

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generate latest.json (updater manifest)
        id: latest_json
        # Soft-fail: a missing platform artifact/sig must not hold the
        # whole release hostage (same principle as the build-desktop matrix
        # not gating publish). If this fails, latest.json simply won't
        # exist and `gh release create assets/*` below won't include it —
        # the release still publishes, just without auto-update support
        # until someone fixes the missing platform and re-uploads it
        # manually (see docs/RELEASING.md).
        continue-on-error: true
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          node scripts/make-latest-json.mjs \
            --dir assets \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md \
            --out assets/latest.json

      - name: Warn if updater manifest was skipped
        if: steps.latest_json.outcome == 'failure'
        run: |
          echo "::warning::latest.json was not generated (see 'Generate latest.json' step above) — the release will publish without updater support until the missing platform artifact/sig is fixed and 'gh release upload' is run manually."

      - name: Create tag + release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          PRERELEASE_FLAG=""
          case "$TAG" in *-*) PRERELEASE_FLAG="--prerelease" ;; esac
          # --target creates the tag at this commit; no manual tagging needed.
          gh release create "$TAG" \
            --title "CubeLite $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG \
            assets/*

      - name: Redeploy GitHub Pages
        # Releases created with GITHUB_TOKEN don't emit workflow-triggering
        # events (recursion guard), so kick the Pages deploy explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
