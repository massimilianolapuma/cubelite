name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Detect releasable version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare workspace version against existing tags
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk -F '"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ -z "$VERSION" ]; then
            echo "Could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos-native:
    name: Build macOS app
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (Release)
        run: |
          xcodebuild build \
            -project apps/macos/cubelite/cubelite.xcodeproj \
            -scheme cubelite \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath dd \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-hoc sign & package (ZIP + DMG)
        # Apple Silicon refuses to run fully unsigned binaries; an ad-hoc
        # signature is the floor until Developer ID signing lands (#121).
        run: |
          APP="dd/Build/Products/Release/cubelite.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"

          ditto -c -k --keepParent "$APP" CubeLite-macOS.zip

          mkdir dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "CubeLite" -srcfolder dmg-staging \
            -ov -format UDZO CubeLite-macOS.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-native
          path: |
            CubeLite-macOS.zip
            CubeLite-macOS.dmg
          if-no-files-found: error

  build-desktop:
    name: Build desktop (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
          - platform: Linux
            os: ubuntu-22.04
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Signs the Tauri updater artifacts (.app.tar.gz / -setup.exe / msi /
      # AppImage) with the minisign private key so tauri-plugin-updater can
      # verify them client-side. See docs/RELEASING.md for backup/rotation.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Tauri / WebKit)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # No dependency cache in the release build: a cache written by a
        # PR/branch run must not feed into published artifacts (cache poisoning).
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm --filter desktop tauri:build

      - name: Collect artifacts with stable names
        shell: bash
        run: |
          mkdir -p out
          bundle_dir="target/release/bundle"
          # createUpdaterArtifacts: true (tauri.conf.json) makes the bundler
          # emit an extra signed artifact + .sig alongside the normal
          # installers: macOS `.app.tar.gz`, Windows nsis `-setup.exe`
          # (msi is also produced but nsis is what we standardize on for
          # the updater), Linux `.AppImage`. deb/rpm/dmg/msi stay
          # release-only assets — they don't go through the Tauri updater,
          # so no updater artifact/sig is collected for them. Stable names
          # here are what scripts/make-latest-json.mjs scans for later.
          case "${{ matrix.platform }}" in
            macOS)
              cp "$(find "$bundle_dir/dmg" -name '*.dmg' | head -1)" out/CubeLite-Desktop-macOS.dmg
              cp "$(find "$bundle_dir/macos" -name '*.app.tar.gz' | head -1)" out/CubeLite-Desktop-macOS.app.tar.gz
              cp "$(find "$bundle_dir/macos" -name '*.app.tar.gz.sig' | head -1)" out/CubeLite-Desktop-macOS.app.tar.gz.sig
              ;;
            Linux)
              cp "$(find "$bundle_dir/appimage" -name '*.AppImage' | head -1)" out/CubeLite-Desktop-Linux.AppImage
              cp "$(find "$bundle_dir/appimage" -name '*.AppImage.sig' | head -1)" out/CubeLite-Desktop-Linux.AppImage.sig
              cp "$(find "$bundle_dir/deb" -name '*.deb' | head -1)" out/CubeLite-Desktop-Linux.deb
              cp "$(find "$bundle_dir/rpm" -name '*.rpm' | head -1)" out/CubeLite-Desktop-Linux.rpm
              ;;
            Windows)
              cp "$(find "$bundle_dir/msi" -name '*.msi' | head -1)" out/CubeLite-Desktop-Windows.msi
              cp "$(find "$bundle_dir/nsis" -name '*.exe' | head -1)" out/CubeLite-Desktop-Windows-setup.exe
              cp "$(find "$bundle_dir/nsis" -name '*.exe.sig' | head -1)" out/CubeLite-Desktop-Windows-setup.exe.sig
              ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [version, build-macos-native, build-desktop]
    # Publish as long as the native macOS app built; a broken desktop
    # platform must not hold the whole release hostage.
    if: always() && needs.version.outputs.should_release == 'true' && needs.build-macos-native.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes from CHANGELOG
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # Pull the "## [X.Y.Z]" section out of CHANGELOG.md when present.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "_No CHANGELOG section for ${VERSION} — see the commit history below._" > notes.md
          fi
          {
            echo ""
            echo "---"
            echo "[Installation guide](https://massimilianolapuma.github.io/cubelite/docs/installation.html) · builds are not yet notarized/signed; see the guide for the one-time Gatekeeper/SmartScreen step."
          } >> notes.md

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate latest.json (updater manifest)
        id: latest_json
        # Soft-fail: a missing platform artifact/sig must not hold the
        # whole release hostage (same principle as the build-desktop matrix
        # not gating publish). If this fails, latest.json simply won't
        # exist and `gh release create assets/*` below won't include it —
        # the release still publishes, just without auto-update support
        # until someone fixes the missing platform and re-uploads it
        # manually (see docs/RELEASING.md).
        continue-on-error: true
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          node scripts/make-latest-json.mjs \
            --dir assets \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md \
            --out assets/latest.json

      - name: Warn if updater manifest was skipped
        if: steps.latest_json.outcome == 'failure'
        run: |
          echo "::warning::latest.json was not generated (see 'Generate latest.json' step above) — the release will publish without updater support until the missing platform artifact/sig is fixed and 'gh release upload' is run manually."

      - name: Create tag + release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          PRERELEASE_FLAG=""
          case "$TAG" in *-*) PRERELEASE_FLAG="--prerelease" ;; esac
          # --target creates the tag at this commit; no manual tagging needed.
          gh release create "$TAG" \
            --title "CubeLite $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG \
            assets/*

      - name: Redeploy GitHub Pages
        # Releases created with GITHUB_TOKEN don't emit workflow-triggering
        # events (recursion guard), so kick the Pages deploy explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
