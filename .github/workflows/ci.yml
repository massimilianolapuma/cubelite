name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "design/**", "docs/**", "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install system dependencies (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install system dependencies (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run tests
        run: cargo test --workspace

  lint-fe:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit files
        run: pnpm --filter desktop exec svelte-kit sync
      - name: Lint
        run: pnpm --filter desktop lint
      - name: Type check
        run: pnpm --filter desktop typecheck

  test-fe:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-fe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit files
        run: pnpm --filter desktop exec svelte-kit sync
      - name: Unit tests
        run: pnpm --filter desktop test
      - name: Design token tests
        run: pnpm design:test

      - name: Test make-latest-json (updater manifest generator)
        # Plain Node, no deps — runs on the runner's preinstalled Node
        # regardless of the desktop app's toolchain, so it isn't gated on
        # has_fe. Exercises both the happy path (exit 0) and the
        # missing-.sig failure (must exit 1) against the fixtures in
        # scripts/fixtures/updater/.
        run: |
          set -e
          node scripts/make-latest-json.mjs --check scripts/fixtures/updater/happy > /dev/null
          echo "happy fixture: OK (exit 0)"

          if node scripts/make-latest-json.mjs --check scripts/fixtures/updater/missing-sig > /dev/null 2>&1; then
            echo "::error::missing-sig fixture unexpectedly succeeded (expected exit 1)"
            exit 1
          fi
          echo "missing-sig fixture: OK (exit 1 as expected)"

  e2e-fe:
    name: E2E Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-fe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter desktop exec playwright install --with-deps chromium
      - name: E2E tests (vite preview + mocked Tauri IPC)
        run: pnpm --filter desktop test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: pnpm audit (moderate and above)
        # Low-severity advisories that are blocked upstream (e.g. `cookie`
        # pinned by @sveltejs/kit) are reported but do not fail the build.
        run: pnpm audit --audit-level moderate
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
