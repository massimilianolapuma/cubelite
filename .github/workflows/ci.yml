name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "design/**", "docs/**", "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace

  lint-fe:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit files
        run: pnpm --filter desktop exec svelte-kit sync
      - name: Lint
        run: pnpm --filter desktop lint
      - name: Type check
        run: pnpm --filter desktop typecheck

  test-fe:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit files
        run: pnpm --filter desktop exec svelte-kit sync
      - name: Unit tests
        run: pnpm --filter desktop test
      - name: Design token tests
        run: pnpm design:test

      - name: Test make-latest-json (updater manifest generator)
        # Plain Node, no deps — runs on the runner's preinstalled Node
        # regardless of the desktop app's toolchain, so it isn't gated on
        # has_fe. Exercises both the happy path (exit 0) and the
        # missing-.sig failure (must exit 1) against the fixtures in
        # scripts/fixtures/updater/.
        run: |
          set -e
          node scripts/make-latest-json.mjs --check scripts/fixtures/updater/happy > /dev/null
          echo "happy fixture: OK (exit 0)"

          if node scripts/make-latest-json.mjs --check scripts/fixtures/updater/missing-sig > /dev/null 2>&1; then
            echo "::error::missing-sig fixture unexpectedly succeeded (expected exit 1)"
            exit 1
          fi
          echo "missing-sig fixture: OK (exit 1 as expected)"

  e2e-fe:
    name: E2E Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        # Lifecycle scripts are not needed for the e2e build (vite/esbuild
        # resolve their platform binaries via optionalDependencies).
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: pnpm --filter desktop test:e2e:setup
      - name: E2E tests (vite preview + mocked Tauri IPC)
        run: pnpm --filter desktop test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: pnpm audit (moderate and above)
        # Low-severity advisories that are blocked upstream (e.g. `cookie`
        # pinned by @sveltejs/kit) are reported but do not fail the build.
        run: pnpm audit --audit-level moderate
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  design-lint:
    name: Design Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test design-lint
        run: scripts/design-lint.test.sh
      - name: design-lint (desktop held at 0, native capped by allow-list)
        run: scripts/design-lint.sh
