name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "design/**", "docs/**", "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    # 30 instead of the default 15: the apt step retries with a timeout per
    # attempt and may legitimately take ~20 min on a bad mirror day (#435).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies (Tauri / WebKit)
        uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30 # see lint-rust
    needs: lint-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies (Tauri / WebKit)
        uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run tests
        run: cargo test --workspace

  lint-fe:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit files
        run: pnpm --filter desktop exec svelte-kit sync
      - name: Lint
        run: pnpm --filter desktop lint
      - name: Type check
        run: pnpm --filter desktop typecheck

  test-fe:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit files
        run: pnpm --filter desktop exec svelte-kit sync
      - name: Unit tests
        run: pnpm --filter desktop test
      - name: Design token tests
        run: pnpm design:test

      - name: Test make-latest-json (updater manifest generator)
        # Plain Node, no deps — runs on the runner's preinstalled Node
        # regardless of the desktop app's toolchain, so it isn't gated on
        # has_fe. Exercises both the happy path (exit 0) and the
        # missing-.sig failure (must exit 1) against the fixtures in
        # scripts/fixtures/updater/.
        run: |
          set -e
          node scripts/make-latest-json.mjs --check scripts/fixtures/updater/happy > /dev/null
          echo "happy fixture: OK (exit 0)"

          if node scripts/make-latest-json.mjs --check scripts/fixtures/updater/missing-sig > /dev/null 2>&1; then
            echo "::error::missing-sig fixture unexpectedly succeeded (expected exit 1)"
            exit 1
          fi
          echo "missing-sig fixture: OK (exit 1 as expected)"

  e2e-fe:
    name: E2E Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        # Lifecycle scripts are not needed for the e2e build (vite/esbuild
        # resolve their platform binaries via optionalDependencies).
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: pnpm --filter desktop test:e2e:setup
      - name: E2E tests (vite preview + mocked Tauri IPC)
        run: pnpm --filter desktop test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pnpm audit (moderate and above)
        # Low-severity advisories that are blocked upstream (e.g. `cookie`
        # pinned by @sveltejs/kit) are reported but do not fail the build.
        run: pnpm audit --audit-level moderate
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  design-lint:
    name: Design Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test design-lint
        run: scripts/design-lint.test.sh
      - name: design-lint (desktop held at 0, native capped by allow-list)
        run: scripts/design-lint.sh
