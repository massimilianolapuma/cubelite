name: Dependabot Jira ticket

on:
    # Fires whenever a branch is created; the job only runs for Dependabot branches.
    create:

jobs:
    handle-dependabot-branch:
        if: startsWith(github.ref_name, 'dependabot/')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Check Jira configuration
              id: config
              # Runs triggered by Dependabot only see Dependabot secrets. When the
              # Jira secrets are not available there, skip instead of failing.
              run: |
                  if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_API_TOKEN" ]; then
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Jira secrets are not available to this run (add them as Dependabot secrets to enable ticket creation) — skipping."
                  else
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
                  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

            - name: Create Jira Issue
              id: create
              if: steps.config.outputs.configured == 'true'
              run: |
                  BODY=$(jq -n \
                    --arg project "$JIRA_PROJECT_KEY" \
                    --arg summary "Security update: $BRANCH" \
                    '{fields:{project:{key:$project},summary:$summary,issuetype:{name:"Task"}}}')
                  RESPONSE=$(curl --fail-with-body -s -X POST \
                    -H "Authorization: Basic $(printf '%s:%s' "$JIRA_USER_EMAIL" "$JIRA_API_TOKEN" | base64 -w0)" \
                    -H "Content-Type: application/json" \
                    -d "$BODY" \
                    "$JIRA_BASE_URL/rest/api/3/issue")
                  ISSUE_KEY=$(echo "$RESPONSE" | jq -r '.key')
                  ISSUE_URL="${JIRA_BASE_URL}/browse/${ISSUE_KEY}"
                  echo "issue=${ISSUE_KEY}" >> "$GITHUB_OUTPUT"
                  echo "issue_url=${ISSUE_URL}" >> "$GITHUB_OUTPUT"
              env:
                  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
                  JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
                  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
                  JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
                  # Passed via env, never interpolated into the script (injection-safe).
                  BRANCH: ${{ github.ref_name }}

            - name: Write job summary
              if: steps.config.outputs.configured == 'true'
              run: |
                  echo "## Jira ticket created" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Branch**: \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Ticket**: [$ISSUE]($ISSUE_URL)" >> "$GITHUB_STEP_SUMMARY"
              env:
                  BRANCH: ${{ github.ref_name }}
                  ISSUE: ${{ steps.create.outputs.issue }}
                  ISSUE_URL: ${{ steps.create.outputs.issue_url }}
