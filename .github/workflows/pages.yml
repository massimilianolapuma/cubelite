name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/guide/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Render user guide (docs/guide/*.md → site/docs/*.html)
        run: |
          mkdir -p site/docs
          for md in docs/guide/*.md; do
            base="$(basename "$md" .md)"
            out="$base.html"
            if [ "$base" = "README" ]; then out="index.html"; fi
            pandoc "$md" \
              --from gfm --to html5 \
              --template site/doc-template.html \
              --metadata title="$(head -1 "$md" | sed 's/^# //')" \
              --output "site/docs/$out"
          done
          # Rewrite relative .md links to their rendered .html counterparts
          sed -i -E 's/href="([^"#:]+)\.md(#[^"]*)?"/href="\1.html\2"/g' site/docs/*.html
          sed -i 's/href="README.html/href="index.html/g' site/docs/*.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
