[package]
name = "cubelite-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
kube = { workspace = true, features = ["oidc"] }
serde_json = { workspace = true }
k8s-openapi = { workspace = true }
base64 = "0.23"
http = "1"
flate2 = "1"
# HTTPS to Elasticsearch (#500); rustls with the ring provider already in the tree.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset"] }
# reqwest without a provider needs a process default: ring, as kube already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"
serial_test = "4"
tower-test = "0.4"
