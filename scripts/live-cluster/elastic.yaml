apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: quickstart
  namespace: logging
spec:
  version: 8.15.3
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms768m -Xmx768m"
              resources:
                requests: { memory: 2Gi, cpu: 200m }
                limits: { memory: 2Gi }
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: quickstart
  namespace: logging
spec:
  version: 8.15.3
  count: 1
  elasticsearchRef:
    name: quickstart
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests: { memory: 700Mi, cpu: 100m }
            limits: { memory: 900Mi }
---
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: quickstart
  namespace: logging
spec:
  type: filebeat
  version: 8.15.3
  elasticsearchRef:
    name: quickstart
  config:
    filebeat.autodiscover.providers:
      - type: kubernetes
        node: ${NODE_NAME}
        hints.enabled: true
        hints.default_config:
          type: container
          paths: ["/var/log/containers/*${data.kubernetes.container.id}.log"]
    processors:
      - add_cloud_metadata: {}
      - add_host_metadata: {}
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true
        securityContext: { runAsUser: 0 }
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            resources:
              requests: { memory: 150Mi, cpu: 50m }
              limits: { memory: 300Mi }
            volumeMounts:
              - { name: varlogcontainers, mountPath: /var/log/containers }
              - { name: varlogpods, mountPath: /var/log/pods }
              - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers }
        volumes:
          - { name: varlogcontainers, hostPath: { path: /var/log/containers } }
          - { name: varlogpods, hostPath: { path: /var/log/pods } }
          - { name: varlibdockercontainers, hostPath: { path: /var/lib/docker/containers } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: filebeat, namespace: logging }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: filebeat }
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, watch, list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: filebeat }
subjects: [{ kind: ServiceAccount, name: filebeat, namespace: logging }]
roleRef: { kind: ClusterRole, name: filebeat, apiGroup: rbac.authorization.k8s.io }
