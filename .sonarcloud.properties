# SonarCloud Automatic Analysis configuration (it reads this file, not
# sonar-project.properties).
#
# Desktop unit tests live next to the code (src/**/*.test.ts) and repeat the
# same vi.mock(...) headers and fixtures by design; keep them out of the
# duplication metric only (issues and hotspots are still analysed).
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts
