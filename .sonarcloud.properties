# SonarCloud Automatic Analysis configuration. Automatic Analysis reads only
# this file; there is no CI scanner. If the project ever moves to a CI-based
# scanner, carry these settings over to sonar-project.properties.

# ── Source scope ─────────────────────────────────────────────────────
# Exclude test directories, build artifacts and design reference assets
# (design/ holds handoff HTML prototypes — documentation, not product code)
# from all analysis: issues, hotspots and duplication. This covers the
# Swift test targets (cubeliteTests, cubeliteUITests: XCTest naming with
# underscores, fixture URIs and mock IPs), the desktop e2e suite and the
# Rust integration tests (tests/), and Rust build output (target/).
sonar.exclusions=**/cubeliteTests/**,**/cubeliteUITests/**,**/tests/**,**/target/**,**/design/**

# ── Duplication ──────────────────────────────────────────────────────
# Desktop unit tests live next to the code (src/**/*.test.ts) and repeat the
# same vi.mock(...) headers and fixtures by design; keep them out of the
# duplication metric only (issues and hotspots are still analysed).
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts
